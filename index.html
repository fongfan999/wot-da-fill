<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!--seo-->
		<title>Wot Da Fill · A card for every name</title>
		<meta
			name="description"
			content="Add your invitation, certificate or name badge, paste your list of names, and download a finished card for each person. Free, no sign-up, and your list never leaves your device."
		/>
		<!--/seo-->
		<!-- Everything between the seo marks is written for each page by scripts/prerender.mjs. -->
		<meta name="color-scheme" content="light dark" />
		<!-- Set to the chosen theme's paper by the theme setting (lib/theme.ts). -->
		<meta name="theme-color" content="#f7f5ee" />
		<!-- Before anything is drawn: the chosen theme (or the system's), so the page never flashes the other one. -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem("wdf:theme");
					if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
					document.documentElement.dataset.theme = t;
					document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#151713" : "#f7f5ee";
				} catch (e) {}
			})();
		</script>
		<!--
			The English home page sends a Vietnamese visitor to /vi/ before anything is drawn: someone who chose
			Vietnamese before, or whose browser or time zone is Vietnamese (as lib/i18n.tsx decides). Choosing
			English is remembered, so they can stay. Search engines crawl in English, so they see both pages.
		-->
		<script>
			(function () {
				if (location.pathname !== "/") return;
				var lang = null;
				try {
					lang = localStorage.getItem("wdf:lang");
				} catch (e) {}
				if (lang !== "en" && lang !== "vi") {
					var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]).map(function (l) {
						return String(l).toLowerCase();
					});
					var zone = "";
					try {
						zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
					} catch (e) {}
					lang =
						langs.some(function (l) {
							return l === "vi" || l.indexOf("vi-") === 0 || /-vn$/.test(l);
						}) ||
						zone === "Asia/Ho_Chi_Minh" ||
						zone === "Asia/Saigon"
							? "vi"
							: "en";
				}
				if (lang === "vi") location.replace("/vi/" + location.search + location.hash);
			})();
		</script>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	</head>
	<body>
		<div id="root"><!--app--></div>
		<noscript style="display: block; padding: 24px; font-family: system-ui, sans-serif">
			Wot Da Fill needs JavaScript. Turn it on in your browser settings, then reload this page. / Wot Da Fill cần JavaScript. Hãy bật
			JavaScript trong cài đặt trình duyệt rồi tải lại trang.
		</noscript>
		<script type="module" src="/src/client/main.tsx"></script>
	</body>
</html>
